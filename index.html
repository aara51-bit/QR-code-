<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT Тест — Информатика</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#161a26;--mu:#6b7285;--bd:#e4e8f2;--ac:#4c6ef5;--ok:#2f9e44;--bad:#e03131;--sh:0 8px 24px rgba(40,50,90,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1017;--card:#181b26;--tx:#eef0f8;--mu:#99a0b5;--bd:#272b3b;--ac:#748ffc;--ok:#51cf66;--bad:#ff6b6b;--sh:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:0 16px 40px}
.hero{margin:0 -16px 18px;padding:34px 22px 56px;color:#fff;background:linear-gradient(135deg,#3b5bdb,#7048e8 60%,#d6336c);border-radius:0 0 28px 28px}
.hero h1{margin:0 0 6px;font-size:28px;letter-spacing:-.5px}.hero p{margin:0;opacity:.9;line-height:1.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chips span{background:rgba(255,255,255,.18);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:var(--sh);margin-bottom:14px}
.pull{margin-top:-34px}
h2{font-size:18px;margin:0 0 12px}p.m{color:var(--mu);margin:0 0 12px;line-height:1.5}
input{font:inherit;width:100%;padding:14px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);outline:0}input:focus{border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tp{font:inherit;color:var(--tx);text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--c);border-radius:18px;padding:14px;box-shadow:var(--sh);transition:transform .15s}
.tp:active{transform:scale(.97)}.tp:hover{transform:translateY(-3px)}
.tp .e{font-size:28px}.tp b{display:block;margin:6px 0 2px;font-size:15px}.tp small{color:var(--mu);font-size:12px;line-height:1.3;display:block}
.tp:last-child:nth-child(odd){grid-column:1/-1}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;gap:10px}
.pill{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-weight:700;font-variant-numeric:tabular-nums}
.pill.low{background:var(--bad);color:#fff;border-color:var(--bad);animation:pu 1s infinite}
@keyframes pu{50%{opacity:.6}}
.pg{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:16px}.pg i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s}
.qt{font-size:19px;line-height:1.45;margin:0 0 16px}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;overflow-x:auto;font:14px ui-monospace,Consolas,monospace;margin:10px 0}
code{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;font-family:ui-monospace,Consolas,monospace;font-size:.9em}
.op{display:flex;gap:12px;align-items:center;width:100%;font:inherit;color:var(--tx);text-align:left;cursor:pointer;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;transition:.15s}
.op:hover{border-color:var(--c)}.op s{text-decoration:none;flex:none;width:30px;height:30px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px}
.op.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}.op.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.btn{font:inherit;font-weight:700;width:100%;padding:15px;border:0;border-radius:14px;background:var(--ac);color:#fff;cursor:pointer;margin-top:6px}.btn.g{background:var(--card);color:var(--tx);border:2px solid var(--bd)}
.ring{display:block;margin:4px auto 8px}.ring text{fill:var(--tx);font-weight:800}
.lv{display:flex;gap:6px;margin:14px 0 6px}.lv span{flex:1;text-align:center;padding:12px 0;border-radius:12px;background:var(--bg);color:var(--mu);font-weight:800;border:2px solid var(--bd)}.lv span.on{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.08)}
.lvn{text-align:center;font-size:20px;font-weight:800;margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:15px}.row:last-child{border:0}.row span{color:var(--mu)}.row b{text-align:right}
.ok-t{color:var(--ok)}.no-t{color:var(--bad)}
.rv{padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}.rv:last-child{border:0}
.fade{animation:f .35s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ======= ӨЗГЕРТУГЕ БОЛАТЫН БӨЛІМ ======= */
var TIME = 15 * 60; // 15 минут (секундпен)
// Деңгейлер: [ең аз балл, нөмір, атауы]
var LV = [[23,5,"Шебер"],[17,4,"Жоғары"],[11,3,"Орта"],[6,2,"Үйренуші"],[0,1,"Жаңадан бастаушы"]];
// Сұрақ: [мәтін, [жауаптар], дұрыс жауап нөмірі (0-ден), балл]  — әр тақырыпта жиыны 25
var T = [
{n:"Python негіздері",e:"🐍",c:"#3b82f6",d:"print, айнымалы, цикл",q:[
 ['<code>print("Сәлем")</code> не істейді?',["Мәтінді экранға шығарады","Пернетақтадан сұрайды","Файлды өшіреді","Санды екі есе көбейтеді"],0,8],
 ['<pre>x = 5\ny = 3\nprint(x + y)</pre>Экранда не шығады?',["8","53","x + y","Қате"],0,8],
 ['<pre>for i in range(3):\n    print(i)</pre>Цикл неше рет орындалады?',["1","2","3","4"],2,9]]},
{n:"Алгоритмдер",e:"🧩",c:"#8b5cf6",d:"логика, блок-схема",q:[
 ["Алгоритм дегеніміз не?",["Есепті шешу қадамдарының реттелген тізбегі","Бағдарламалау тілі","Компьютер бөлшегі","Файл түрі"],0,8],
 ["Блок-схемада шартты (иә / жоқ) қай фигура көрсетеді?",["Тіктөртбұрыш","Сопақша","Ромб","Параллелограмм"],2,8],
 ['<pre>x = 2\nx = x + 3\nx = x * 2</pre>Соңында x неге тең?',["7","10","12","5"],1,9]]},
{n:"Ақпарат және кодтау",e:"💾",c:"#f59f00",d:"биттер, байттар, екілік жүйе",q:[
 ["1 байт неше битке тең?",["4","8","16","10"],1,8],
 ["Екілік жүйедегі <code>101</code> саны ондықта нешеге тең?",["3","4","5","6"],2,8],
 ["1 Кбайт неше байт (компьютерде)?",["100","1000","1024","2048"],2,9]]},
{n:"Деректер қоры",e:"🗄️",c:"#12b886",d:"Excel, SQL, кестелер",q:[
 ["SQL-де кестеден деректерді таңдау командасы қайсы?",["SELECT","INSERT","DELETE","UPDATE"],0,8],
 ["Excel-де A1=2, A2=3, A3=5. <code>=SUM(A1:A3)</code> нәтижесі?",["10","235","5","Қате"],0,8],
 ["Кестедегі әр жазбаны бірегей анықтайтын баған қалай аталады?",["Бастапқы кілт (Primary key)","Сүзгі","Диаграмма","Формула"],0,9]]},
{n:"Желілер және интернет",e:"🌐",c:"#1c7ed6",d:"IP, DNS, HTTPS",q:[
 ["IP-адрес не үшін керек?",["Желідегі құрылғыны анықтау","Файлды сығу","Дыбысты өзгерту","Экранды баптау"],0,8],
 ["Сайт атын IP-адреске айналдыратын қызмет қайсы?",["DNS","HTML","SQL","CSS"],0,8],
 ["HTTPS-тегі <code>S</code> нені білдіреді?",["Қауіпсіз (шифрланған) байланыс","Жылдам","Сервер","Сайт"],0,9]]},
{n:"Веб-технологиялар",e:"🎨",c:"#e8590c",d:"HTML, CSS, JavaScript",q:[
 ["HTML не үшін қолданылады?",["Бет құрылымын жасау","Дерекқор сақтау","Желі жылдамдығын өлшеу","Файл сығу"],0,8],
 ["Ең үлкен тақырып қай тегпен жазылады?",["&lt;h1&gt;","&lt;p&gt;","&lt;img&gt;","&lt;a&gt;"],0,8],
 ["JavaScript сайтқа не қосады?",["Интерактив (батырма, анимация)","Тек түс","Тек сурет","Сервер қуаты"],0,9]]},
{n:"Киберқауіпсіздік",e:"🛡️",c:"#e03131",d:"құпиясөз, фишинг, 2FA",q:[
 ["Фишинг дегеніміз не?",["Алдау арқылы құпия деректерді алу","Вирусты өшіру","Файлды сығу","Интернетті жылдамдату"],0,8],
 ["Қайсысы ең мықты құпиясөз?",["123456","qwerty","Aa7#kLp29!x","password"],2,8],
 ["2FA (екі факторлы аутентификация) не береді?",["Кірудің қосымша тексеруін","Интернет жылдамдығын","Файл көлемін кішірейтуді","Жаңа аккаунтты"],0,9]]}
];
/* ====================================== */
var $=document.getElementById("app"),S;
function reset(n){S={st:0,t:0,i:0,a:[],left:TIME,iv:null,name:n||"",lock:0}}reset();
function m(s){return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function Q(){return T[S.t].q}
function tot(){return Q().reduce(function(a,q){return a+q[3]},0)}
function sc(){return Q().reduce(function(a,q,k){return a+(S.a[k]===q[2]?q[3]:0)},0)}
function lvl(){var s=sc();for(var k=0;k<LV.length;k++)if(s>=LV[k][0])return LV[k]}
function R(){
 var h="",c=T[S.t].c;
 if(S.st===0){
  h='<div class="hero fade"><h1>IT Тест 🚀</h1><p>Информатика бойынша білімді тексер: тақырыпты таңда, сұрақтарға жауап бер және деңгейіңді біл.</p><div class="chips"><span>⏱ 15 минут</span><span>⭐ 25 балл</span><span>🏆 5 деңгей</span></div></div>'+
  '<div class="card pull fade"><h2>Танысайық</h2><input id="nm" placeholder="Аты-жөніңіз" value="'+S.name+'"></div>'+
  '<h2 style="margin:6px 4px">Тақырыпты таңда</h2><div class="grid">';
  T.forEach(function(t,k){h+='<button class="tp fade" style="--c:'+t.c+'" onclick="go('+k+')"><span class="e">'+t.e+'</span><b>'+t.n+'</b><small>'+t.d+'</small></button>'});
  h+='</div>';
 }else if(S.st===1){
  var q=Q()[S.i];
  h='<div class="top"><span class="pill">'+T[S.t].e+' '+(S.i+1)+' / '+Q().length+'</span><span class="pill'+(S.left<60?' low':'')+'" id="tm">⏱ '+m(S.left)+'</span></div>'+
  '<div class="pg" style="--c:'+c+'"><i style="width:'+(S.i/Q().length*100)+'%"></i></div>'+
  '<div class="card fade" style="--c:'+c+'"><p class="m">'+T[S.t].n+' · '+q[3]+' балл</p><div class="qt">'+q[0]+'</div>';
  q[1].forEach(function(o,j){h+='<button class="op" onclick="ans('+j+')"><s>'+"ABCD"[j]+'</s><span>'+o+'</span></button>'});
  h+='</div>';
 }else{
  var L=lvl(),p=sc()/tot(),C=2*Math.PI*52;
  h='<div class="hero fade" style="padding-bottom:30px"><h1>Нәтиже 🎉</h1><p>'+(S.name||"Оқушы")+', '+T[S.t].n+'</p></div>'+
  '<div class="card fade" style="--c:'+c+'"><svg class="ring" width="150" height="150" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bd)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="'+c+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C*p+' '+C+'" transform="rotate(-90 60 60)"/><text x="60" y="58" text-anchor="middle" font-size="26">'+sc()+'</text><text x="60" y="78" text-anchor="middle" font-size="11" style="fill:var(--mu)">/ '+tot()+' балл</text></svg>'+
  '<div class="lv">';
  for(var k=1;k<=5;k++)h+='<span class="'+(k===L[1]?'on':'')+'">'+k+'</span>';
  h+='</div><div class="lvn">'+L[1]+'-деңгей: '+L[2]+'</div></div>'+
  '<div class="card fade"><h2>Ақпарат есебі</h2><div class="row"><span>Оқушы</span><b>'+(S.name||"—")+'</b></div><div class="row"><span>Тақырып</span><b>'+T[S.t].n+'</b></div><div class="row"><span>Жұмсалған уақыт</span><b>'+m(TIME-S.left)+' / '+m(TIME)+'</b></div><div class="row"><span>Дұрыс жауап</span><b>'+Q().filter(function(q,k){return S.a[k]===q[2]}).length+' / '+Q().length+'</b></div><div class="row"><span>Балл</span><b>'+sc()+' / '+tot()+'</b></div></div>'+
  '<div class="card fade"><h2>Қателермен жұмыс</h2>';
  Q().forEach(function(q,k){var ok=S.a[k]===q[2];h+='<div class="rv"><b class="'+(ok?'ok-t':'no-t')+'">'+(ok?'✓':'✗')+' '+(k+1)+'-сұрақ'+(ok?' · +'+q[3]:'')+'</b>'+(ok?'':'<br><span class="m">Дұрыс жауап: '+q[1][q[2]]+'</span>')+'</div>'});
  h+='</div><button class="btn" onclick="reset(S.name);R()">Басқа тақырып таңдау</button><button class="btn g" onclick="go(S.t)">Осы тақырыпты қайта тапсыру</button>';
 }
 $.innerHTML=h;window.scrollTo(0,0);
}
function go(k){var e=document.getElementById("nm"),n=e?e.value.trim():S.name;reset(n);S.t=k;S.st=1;
 S.iv=setInterval(function(){S.left--;var e=document.getElementById("tm");if(e){e.textContent="⏱ "+m(S.left);if(S.left<60)e.className="pill low"}if(S.left<=0)fin()},1000);R()}
function ans(j){if(S.lock)return;S.lock=1;S.a[S.i]=j;var q=Q()[S.i],b=document.querySelectorAll(".op");b[q[2]].classList.add("ok");if(j!==q[2])b[j].classList.add("no");
 setTimeout(function(){S.lock=0;if(S.i<Q().length-1){S.i++;R()}else fin()},900)}
function fin(){clearInterval(S.iv);S.st=2;R()}
R();
</script>
</body>
</html>
